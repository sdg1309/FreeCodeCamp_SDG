<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Audio and Video Lab</title>
</head>
<body>
  <h1>Audio and Video</h1>

  <section>
    <h2>Video playing</h2>
    <video 
    width="640"
    controls>
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>

  <section>
    <h2>Audio playing</h2>
    <audio 
    controls
    loop
    src="audio.mp3" type="audio/mp3">
      Your browser does not support the audio tag.
    </audio>
  </section>
</body>
</html>
